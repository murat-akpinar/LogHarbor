# A directory to develop Phase 21 (LDAP sign-in) against. Runs standalone — no
# external network — so it can live on its own host (192.168.1.132) while LogHarbor
# runs on another.

services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-test
    hostname: ldap.test.local
    environment:
      LDAP_ORGANISATION: "LogHarbor Test Directory"
      LDAP_DOMAIN: "test.local"
      LDAP_BASE_DN: "dc=test,dc=local"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      # on, so the ldaps:// and StartTLS paths Phase 21 insists on can be exercised
      # here rather than only against a real domain controller
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      # the image's cert is self-signed; demanding a client cert would lock out every
      # ordinary LDAP client, this one included
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_REPLICATION: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ldap_certs:/container/service/slapd/assets/certs
      # the setup scripts run inside the container, where the ldap tools already are
      - ./:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=test,dc=local -D 'cn=admin,dc=test,dc=local' -w admin123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin-test
    hostname: phpldapadmin.test.local
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8082:80"
    depends_on:
      - ldap

volumes:
  ldap_data:
  ldap_config:
  ldap_certs:
